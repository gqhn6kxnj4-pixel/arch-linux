# #######################################################################################
# HYPRLAND CONFIG – Sonoma Style (NVIDIA safe)
# #######################################################################################

monitor=,1920x1080@120,0x0,1

$terminal = kitty
$fileManager = dolphin
$menu = wofi --show drun

exec-once = udiskie --tray &
exec-once = fc-cache -fv
exec-once = waybar
exec-once = hyprpaper
exec-once = ~/.config/hypr/random-wallpaper.sh

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_THEME,Nordzy-cursors
env = XCURSOR_SIZE,24
#env = XCURSOR_SIZE,24
#env = XCURSOR_THEME,Catppuccin-Mocha-Dark
env = HYPRLAND_GLOBAL_FONT,SF Pro Display

env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_STYLE_OVERRIDE,qt5ct

# NVIDIA
env = WLR_NO_HARDWARE_CURSORS,1
env = LIBVA_DRIVER_NAME,nvidia
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = __GL_VRR_ALLOWED,1

render_ahead_of_time = true
cursor_inhibitor = force

################
### GENERAL ###
################

general {
    gaps_in = 6
    gaps_out = 14

    border_size = 2
    col.active_border = rgba(138,173,244,0.9)
    col.inactive_border = rgba(60,60,60,0.6)

    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

##################
### DECORATION ###
##################

decoration {
    rounding = 14
    rounding_power = 2

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(0,0,0,0.45)
    }

    blur {
        enabled = true
        size = 4
        passes = 2
        vibrancy = 0.15
    }
}

##################
### ANIMATIONS ###
##################

animations {
    enabled = yes, please :)

    bezier = mac, 0.25, 0.1, 0.25, 1.0
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear, 0, 0, 1, 1
    bezier = almostLinear, 0.5, 0.5, 0.75, 1
    bezier = quick, 0.15, 0, 0.1, 1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.5, mac
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 2, mac, fade
}

#################
### LAYOUTS ###
#################

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = true
}

################
### INPUT ###
################

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = false
    }
}

gesture = 3, horizontal, workspace

##################
### KEYBINDS ###
##################

$mainMod = SUPER

bind = $mainMod, T, exec, kitty
bind = $mainMod, Q, killactive,
bind = SUPER, E, exec, thunar
bind = SUPER, SPACE, exec, wofi --show drun
# Firefox – FLASH MODE (máximo rendimiento)
bind = SUPER, F, exec, ~/.local/bin/firefox-flash.sh
bind = SUPER, S, exec, ~/.local/bin/steam-hw.sh
bind = SUPER, K, exec, kitty mpv-torrent


bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

bindl = ,XF86AudioNext, exec, playerctl next
bindl = ,XF86AudioPrev, exec, playerctl previous
bindl = ,XF86AudioPlay, exec, playerctl play-pause
bindl = ,XF86AudioPause, exec, playerctl play-pause

bind = , Print, exec, ~/.config/hypr/scripts/screenshot_full.sh
bind = CTRL, Print, exec, ~/.config/hypr/scripts/screenshot_select.sh

# Switch workspaces with mainMod + [0-9] 
bind = $mainMod, 1, workspace, 1 
bind = $mainMod, 2, workspace, 2 
bind = $mainMod, 3, workspace, 3 
bind = $mainMod, 4, workspace, 4 
bind = $mainMod, 5, workspace, 5 
bind = $mainMod, 6, workspace, 6 
bind = $mainMod, 7, workspace, 7 
bind = $mainMod, 8, workspace, 8 
bind = $mainMod, 9, workspace, 9 
bind = $mainMod, 0, workspace, 10

# Mover ventana y seguirla
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 1, workspace, 1

bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 2, workspace, 2

bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 3, workspace, 3

bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 4, workspace, 4

bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 5, workspace, 5

bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 6, workspace, 6

bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 7, workspace, 7

bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 8, workspace, 8

bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 9, workspace, 9

bind = SUPER SHIFT, 0, movetoworkspace, 10
bind = SUPER SHIFT, 0, workspace, 10

###################
### RULES ###
###################

windowrule = suppressevent maximize, class:.*
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

layerrule = blur, waybar
layerrule = ignorezero, waybar

gpu = nvidia
enablevrr = true
triplebuffer = true
usegbm = true

misc {
    vrr = true
    animate_manual_resizes = true
    animate_mouse_windowdragging = true
}

